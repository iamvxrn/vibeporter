name: Publish npm wrapper

# Publishes via npm Trusted Publishing (OIDC). No NPM_TOKEN.
# On npmjs.com → vibeporter → Settings → Trusted Publisher → GitHub Actions:
#   owner: iamvxrn
#   repository: vibeporter
#   workflow filename: publish-npm.yml
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag whose npm/package.json to publish
        required: true
        default: v0.3.0

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    name: Publish npm wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Publish
        working-directory: npm
        run: |
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm publish --access public
