name: Publish npm wrapper

# Publishes via npm Trusted Publishing (OIDC). No NPM_TOKEN.
# The trusted publisher on npmjs.com must match this filename exactly:
#   owner: iamvxrn
#   repository: vibeporter
#   workflow filename: publish-npm.yml
# Publishing from release.yml fails with ENEEDAUTH because OIDC is bound
# to this workflow name, not Release Binaries.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag whose npm/package.json to publish
        required: true
        default: v0.5.0

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    name: Publish npm wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Publish
        working-directory: npm
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm publish --access public
